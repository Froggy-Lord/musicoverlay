name: Release

# Cut a release by pushing a version tag (git tag v1.0.0 && git push origin v1.0.0),
# or run this manually from the Actions tab and type the tag. Builds a jar for every
# supported Minecraft version and attaches them to a GitHub release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all Minecraft targets
        run: |
          chmod +x gradlew build-all.sh
          ./build-all.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "$TAG" \
            --title "Music Overlay $TAG" \
            --notes "Jars for Minecraft 26.1.2 and 26.2 are attached below. Drop the one for your version into \`mods/\` alongside Fabric API." \
            build/libs/musicoverlay-*+mc26.1.2.jar \
            build/libs/musicoverlay-*+mc26.2.jar
